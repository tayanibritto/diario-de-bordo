<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diário de Bordo: registre suas experiências diárias de forma simples, offline e acessível.">
    <title>Diário de Bordo</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d47a1">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Diário de Bordo</h1>
    </header>

    <main>

        <!-- Formulário -->
        <section class="form-section">
            <h2>Registrar Experiência</h2>

            <form id="rgForm">
                <input type="text" id="title" placeholder="Título" aria-label="Título da experiência" required>
                <textarea id="description" placeholder="Descrição" aria-label="Descrição da experiência" required></textarea>
                <input type="date" id="date" aria-label="Data da experiência" required>

                <button type="submit" aria-label="Botão de Salvar">Salvar</button>
            </form>
        </section>

        <!-- Lista -->
        <section class="list-section">
            <h2>Minhas Experiências</h2>
            <ul id="xpList"></ul>
        </section>

        <!-- Botão de Instalação do PWA -->
        <button class="install-btn" id="installBtn" aria-label="Botão de Instalar Aplicativo">
            <span class="install-btn-full">Instalar App</span>
            <span class="install-btn-short">Instalar</span>
        </button>

    </main>

    <!-- JavaScript -->
    <script src="script.js" defer></script>
    
</body>
</html>
